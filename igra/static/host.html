<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Своя игра — ведущий</title>
<link rel="stylesheet" href="static/style.css">
<style>
  /* Слева — то же, что видят игроки; справа — пульт ведущего */
  /* minmax(0, 1fr): левая часть не может растянуться от длинного текста и вытолкнуть пульт за экран
     (раньше длинный ответ игрока уводил кнопки вправо) */
  .host-layout { display: grid; grid-template-columns: minmax(0, 1fr) 380px; height: 100vh; }
  .host-layout .app { height: 100vh; }
  .panel {
    min-width: 0; height: 100vh; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px;
    background: rgba(4,9,37,.75); border-left: 1px solid var(--line);
  }
  .box { background: rgba(18,32,122,.45); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .box h3 { margin: 0; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .phase-name { font-family: var(--display); font-size: 22px; color: var(--cyan); }
  .answer-box { border: 2px solid var(--green); background: rgba(54,217,133,.1); }
  .answer-box .a { font-family: var(--display); font-size: 24px; color: var(--gold); overflow-wrap: anywhere; }
  /* Длинный правильный ответ на пульте — мельче и в рамке с прокруткой, чтобы кнопки ниже не уезжали */
  .answer-box .a.long { font-size: 16px; font-family: inherit; font-weight: 800; max-height: 28vh; overflow-y: auto; }
  .answer-box .c { color: var(--muted); font-size: 13px; white-space: pre-wrap; }
  .answer-box .w { color: #ffb3c0; font-size: 13px; font-weight: 700; }
  .appeal-box { border: 2px solid var(--red); background: rgba(255,77,109,.1); animation: fadeIn .3s ease; }
  .award-box { display: flex; flex-direction: column; gap: 8px; padding: 10px; border-radius: 10px; border: 1px solid var(--gold); }
  .award-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .award-row label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 700; color: var(--muted); }
  .award-row input { padding: 8px; font-size: 16px; border-radius: 8px; width: 100%; min-width: 0; }
  .judge-row { display: flex; flex-direction: column; gap: 6px; padding: 10px; border-radius: 10px; background: rgba(255,255,255,.05); }
  .judge-row .jr-top { display: flex; justify-content: space-between; gap: 8px; }
  .judge-row .jr-ans { font-weight: 800; font-size: 17px; color: var(--gold); overflow-wrap: anywhere; max-height: 30vh; overflow-y: auto; }
  .judge-row .jr-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .actions .wide { grid-column: 1 / -1; }
  .actions .btn { padding: 14px 10px; }
  .judge .btn { font-size: 20px; padding: 18px 10px; }
  .prow { display: flex; align-items: center; gap: 6px; padding: 6px 8px; border-radius: 10px; background: rgba(255,255,255,.04); }
  .prow.ch { outline: 2px solid var(--cyan); }
  .prow.ans { outline: 2px solid var(--gold); }
  .prow .nm { flex: 1; font-weight: 700; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .prow .nm.off { opacity: .45; }
  .prow .sc { font-family: var(--display); color: var(--gold); min-width: 54px; text-align: right; cursor: pointer; }
  .prow .sc:hover { text-decoration: underline; }
  .set { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 14px; font-weight: 600; }
  .set input[type=number] { width: 80px; padding: 6px 8px; font-size: 14px; border-radius: 8px; }
  .set input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--gold); }
  .join-info { font-size: 14px; line-height: 1.6; }
  .join-info b { color: var(--gold); font-family: var(--display); font-weight: 400; font-size: 18px; }
  select { width: 100%; }
  /* Выбор пака: кнопка с текущим паком и выпадающий список с крестиками */
  .pack-picker { position: relative; }
  .pack-current {
    width: 100%; text-align: left; font: inherit; font-size: 15px; font-weight: 600; color: var(--text); cursor: pointer;
    background: rgba(4,9,37,.7); border: 2px solid var(--line); border-radius: 12px; padding: 12px 36px 12px 14px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; position: relative;
  }
  .pack-current::after { content: "▾"; position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); }
  .pack-current.open, .pack-current:focus-visible { border-color: var(--cyan); outline: none; }
  .pack-current:disabled { cursor: default; opacity: .6; }
  .pack-list {
    position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 20; max-height: 50vh; overflow-y: auto;
    background: #0b1660; border: 1px solid var(--cyan); border-radius: 12px; padding: 4px; box-shadow: 0 12px 30px rgba(0,0,30,.6);
  }
  .pack-row { display: flex; align-items: center; gap: 8px; padding: 8px 6px 8px 10px; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600; }
  .pack-row:hover { background: rgba(255,255,255,.08); }
  .pack-row.on { background: rgba(95,224,255,.18); }
  .pack-name { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .pack-tag { font-size: 11px; font-weight: 800; color: var(--gold); white-space: nowrap; }
  .pack-del {
    flex: none; width: 30px; height: 30px; border: 0; border-radius: 8px; cursor: pointer;
    background: rgba(255,255,255,.06); color: var(--muted); font-size: 14px;
  }
  .upload-state { font-size: 13px; font-weight: 700; color: var(--cyan); }
  .pack-del:hover { background: var(--red); color: #fff; }
  .muted-note { color: var(--muted); font-size: 12px; }
  details summary { cursor: pointer; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
  .stage .board-hint { font-size: 16px; }
  @media (max-width: 900px) { .host-layout { grid-template-columns: 1fr; } .host-layout .app { height: 60vh; } .panel { height: auto; } body { overflow: auto; } }
</style>
</head>
<body>
  <!-- Вход по PIN (только если ведущий открыл страницу с другого компьютера) -->
  <div class="overlay" id="pinBox" style="display:none; cursor:default">
    <form class="box" id="pinForm" style="width:340px; text-align:center">
      <h3>Вход ведущего</h3>
      <div class="muted-note">PIN написан в окне сервера</div>
      <input type="password" id="pinInput" inputmode="numeric" maxlength="6" placeholder="PIN" style="text-align:center; font-size:28px">
      <button class="btn gold">Войти</button>
    </form>
  </div>

  <div class="host-layout">
    <div class="app">
      <div class="topbar">
        <div class="logo"><span>С</span><span>И</span></div>
        <div class="round-label" id="roundLabel"></div>
        <div class="spacer"></div>
        <div class="pack-label" id="packLabel"></div>
        <div class="conn" id="conn"></div>
      </div>
      <div class="stage" id="stage"></div>
      <div class="timerbar" id="timer"><i></i></div>
      <div class="players" id="players"></div>
    </div>

    <aside class="panel">
      <div class="box">
        <h3>Сейчас</h3>
        <div class="phase-name" id="phaseName">—</div>
        <div class="actions" id="actions"></div>
      </div>

      <div class="box appeal-box" id="appealBox" style="display:none">
        <h3>Апелляции</h3>
        <div id="appealList"></div>
      </div>

      <div class="box answer-box" id="answerBox" style="display:none">
        <h3>Правильный ответ</h3>
        <div class="a" id="answerText"></div>
        <div class="w" id="answerWrong"></div>
        <div class="c" id="answerComment"></div>
      </div>

      <div class="box" id="lobbyBox">
        <h3>Пак вопросов</h3>
        <!-- Свой выпадающий список: у каждого пака крестик «удалить» -->
        <div class="pack-picker" id="packPicker">
          <button type="button" class="pack-current" id="packCurrent" aria-haspopup="listbox"></button>
          <div class="pack-list" id="packList" role="listbox" hidden></div>
        </div>
        <div class="actions">
          <button class="btn" id="loadPack">Загрузить</button>
          <label class="btn ghost" style="text-align:center">Добавить .siq<input type="file" id="upload" accept=".siq" hidden></label>
        </div>
        <div class="upload-state" id="uploadState" style="display:none"></div>
        <a class="btn ghost" href="editor" target="_blank" style="text-align:center; text-decoration:none">Редактор паков</a>
        <div class="muted-note">Паки можно класть прямо в папку <b>packs</b> рядом с сервером.</div>
      </div>

      <div class="box">
        <h3>Игроки</h3>
        <div id="plist"></div>
        <div class="muted-note">Клик по очкам — изменить. ★ — передать выбор вопроса.</div>
      </div>

      <div class="box join-info" id="joinInfo"></div>

      <details class="box">
        <summary>Настройки</summary>
        <label class="set">Звук на этой странице <input type="checkbox" id="hostSound"></label>
        <label class="set">Звук у игроков <input type="checkbox" data-set="players_sound"></label>
        <label class="set">Минус за неверный ответ <input type="checkbox" data-set="minus_for_wrong"></label>
        <label class="set">Время на нажатие, сек <input type="number" min="3" max="120" data-set="open_time"></label>
        <label class="set">Таймер ответа, сек <input type="number" min="3" max="120" data-set="answer_time"></label>
        <label class="set">Показ ответа, сек <input type="number" min="2" max="60" data-set="reveal_time"></label>
        <label class="set">Блок за фальстарт, сек <input type="number" min="0" max="5" step="0.5" data-set="falstart_block"></label>
        <label class="set">Скорость текста, букв/сек (0 — сразу) <input type="number" min="0" max="100" data-set="read_speed"></label>
        <label class="set">Прокрутка длинного текста, пикс/сек <input type="number" min="5" max="200" data-set="scroll_speed"></label>
        <label class="set">Письменный ответ, сек <input type="number" min="10" max="180" data-set="write_time"></label>
        <label class="set">Ответ в финале, сек <input type="number" min="10" max="300" data-set="final_write_time"></label>
        <label class="set">Ставка в финале, сек <input type="number" min="10" max="120" data-set="final_bet_time"></label>
        <label class="set">Апелляции игроков <input type="checkbox" data-set="allow_appeals"></label>
        <label class="set">Играть все финальные темы <input type="checkbox" data-set="play_all_final"></label>
      </details>
    </aside>
  </div>

<script src="static/common.js"></script>
<script src="static/host.js"></script>
</body>
</html>
