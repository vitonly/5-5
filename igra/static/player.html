<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Своя игра</title>
<link rel="stylesheet" href="static/style.css">
<style>
  /* ---------- Экран входа ---------- */
  .join { position: fixed; inset: 0; display: grid; place-items: center; z-index: 20; }
  .join-box {
    width: min(460px, 92vw); padding: 36px 32px; border-radius: 22px; text-align: center;
    background: var(--panel); border: 1px solid var(--line); backdrop-filter: blur(6px);
    display: flex; flex-direction: column; gap: 16px; box-shadow: 0 30px 80px rgba(0,0,0,.5);
  }
  .join-box .logo { justify-content: center; font-size: 34px; }
  .join-box .logo span { width: 46px; height: 46px; font-size: 28px; }
  .join-box input { text-align: center; font-size: 20px; font-weight: 700; }
  .join-box .btn { font-size: 20px; padding: 16px; }

  /* ---------- Большая кнопка ответа ---------- */
  .buzz-row { display: flex; justify-content: center; align-items: center; gap: 18px; }
  .buzz {
    width: min(560px, 90vw); height: 72px; border-radius: 22px; border: 0; cursor: pointer;
    font-family: var(--display); font-size: 30px; letter-spacing: .06em; color: #fff;
    background: linear-gradient(180deg, #3a4690, #252e66);
    box-shadow: inset 0 2px 0 rgba(255,255,255,.15), 0 8px 0 #141a40, 0 14px 30px rgba(0,0,0,.45);
    transition: transform .05s, box-shadow .05s, filter .2s;
    user-select: none; -webkit-tap-highlight-color: transparent;
  }
  .buzz:active { transform: translateY(6px); box-shadow: inset 0 2px 0 rgba(255,255,255,.15), 0 2px 0 #141a40, 0 4px 10px rgba(0,0,0,.45); }
  .buzz.idle { color: var(--muted); }
  .buzz.open {
    background: linear-gradient(180deg, #ff5d79, #d81f44);
    box-shadow: inset 0 2px 0 rgba(255,255,255,.3), 0 8px 0 #7d0d22, 0 0 50px rgba(255,77,109,.6);
    animation: pulse .9s ease-in-out infinite;
  }
  .buzz.me { background: linear-gradient(180deg, var(--gold), var(--gold-2)); color: #2a1a00; box-shadow: 0 8px 0 #8a5a00, 0 0 60px rgba(255,190,40,.7); }
  .buzz.blocked { background: #5a1020; color: #ffb3c0; animation: shake .3s; }
  .buzz.out { opacity: .5; }
  @keyframes pulse { 50% { filter: brightness(1.2); } }
  @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  .key-hint { color: var(--muted); font-size: 13px; font-weight: 700; }
  .key-hint kbd { border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; color: var(--text); }
  /* Панель действий: кот, аукцион, ставки, письменный ответ */
  .action-panel {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 10px;
    min-height: 72px; padding: 10px 16px; border-radius: 18px;
    background: rgba(18,32,122,.6); border: 2px solid var(--gold); box-shadow: 0 0 40px rgba(255,190,40,.25);
    animation: fadeIn .3s ease both;
  }
  .action-panel .lbl { font-weight: 800; font-size: 18px; margin-right: 6px; }
  .action-panel .btn { font-size: 18px; padding: 14px 22px; }
  .action-panel input { width: 160px; font-size: 20px; font-weight: 800; text-align: center; }
  .action-panel input.wide { width: min(520px, 60vw); text-align: left; }
  .action-panel .note { color: var(--muted); font-weight: 700; }
  .action-panel .ans-count { color: var(--muted); font-weight: 700; font-size: 14px; min-width: 64px; }
  .action-panel .ans-count.near { color: var(--gold); }
  .action-panel { max-width: 100%; }
  .appeal { font-size: 14px; }
  .lobby-players { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; max-width: 900px; }
  .lobby-players span { padding: 8px 14px; border-radius: 99px; background: rgba(255,255,255,.08); font-weight: 700; }
</style>
</head>
<body>
  <!-- Экран ввода имени -->
  <div class="join" id="join" style="display:none">
    <form class="join-box" id="joinForm">
      <div class="logo"><span>С</span><span>В</span><span>О</span><span class="g">Я</span></div>
      <div class="mega" style="font-size:42px">ИГРА</div>
      <input type="text" id="nameInput" maxlength="24" placeholder="Ваше имя" autocomplete="off" required>
      <button class="btn gold" type="submit">Войти в игру</button>
    </form>
  </div>

  <div class="app" id="app" style="display:none">
    <div class="topbar">
      <div class="logo"><span>С</span><span>И</span></div>
      <div class="round-label" id="roundLabel"></div>
      <div class="spacer"></div>
      <div class="pack-label" id="packLabel"></div>
      <div class="conn" id="conn" title="Связь с сервером"></div>
    </div>
    <div class="stage" id="stage"></div>
    <div class="timerbar" id="timer"><i></i></div>
    <div class="players" id="players"></div>
    <!-- Обычно здесь кнопка ответа. В особых моментах (кот, аукцион, ставки, письменный ответ)
         вместо неё появляется панель действий -->
    <div class="buzz-row" id="buzzRow">
      <button class="buzz idle" id="buzz">ЖДИТЕ</button>
      <div class="key-hint">или <kbd>Пробел</kbd></div>
      <button class="btn ghost appeal" id="appealBtn" style="display:none">Оспорить</button>
    </div>
    <div class="action-panel" id="actionPanel" style="display:none"></div>
  </div>

<script src="static/common.js"></script>
<script src="static/player.js"></script>
</body>
</html>
