# «Своя игра» на сайте: всё, что начинается с /igra/, отдаём службе игры (порт 8090).
# Вставить внутрь блока server { ... } сайта (рядом с location / { proxy_pass http://127.0.0.1:3000; }).

location = /igra { return 301 /igra/; }

location /igra/ {
    proxy_pass http://127.0.0.1:8090/;          # слэш в конце убирает /igra из пути
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;     # WebSocket: постоянное соединение игры
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 3600s;                   # не рвать соединение во время долгой игры
    proxy_send_timeout 3600s;
    client_max_body_size 1024m;                 # загрузка паков с видео через пульт
    proxy_request_buffering off;
    proxy_buffering off;
}
