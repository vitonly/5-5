# LiveKit SFU for START+ voice rooms. No recording/egress.
# Production keys are written by scripts/vps_livekit_up.py (do not commit real secrets).
# Local template keys below are for docker compose smoke only.
port: 7880
bind_addresses:
  - ""

rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50050
  use_external_ip: true

redis:
  address: 127.0.0.1:6379

keys:
  # replaced on VPS by vps_livekit_up.py
  spk_local_dev_key_replace_me: local-dev-secret-at-least-32-chars!!!!

logging:
  level: info

room:
  empty_timeout: 3600
  max_participants: 5
  auto_create: true
  # Allow admin MutePublishedTrack(muted=false) — off by default in LiveKit
  enable_remote_unmute: true
