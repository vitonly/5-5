# LiveKit SFU for START+ voice rooms. No recording/egress.
# Keys and redis are set for host-network compose (see docker-compose.yml).
port: 7880
bind_addresses:
  - ""

rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50050
  use_external_ip: true

redis:
  address: 127.0.0.1:6379

keys:
  devkey: secret-at-least-32-chars-long!!!!

logging:
  level: info

room:
  empty_timeout: 3600
  max_participants: 5
  auto_create: true
